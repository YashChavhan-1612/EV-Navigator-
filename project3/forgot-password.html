<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forgot Password | EV Navigator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .reset-box {
      background: white;
      padding: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 8px;
    }

    .reset-box h2 {
      margin-bottom: 20px;
    }

    .reset-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
    }

    .reset-box button {
      padding: 10px;
      width: 100%;
      background-color: #0fa958;
      border: none;
      color: white;
      cursor: pointer;
    }

    .success {
      color: green;
      margin-bottom: 10px;
    }

    .back-to-login {
      text-align: center;
      margin-top: 15px;
    }

    .back-to-login a {
      color: #0fa958;
      text-decoration: none;
    }

    .back-to-login a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="reset-box">
    <h2>Reset Password</h2>
    <div class="success" id="successMsg"></div>
    <input type="email" id="email" placeholder="Enter your email" />
    <button onclick="resetPassword()">Reset Password</button>

    <div class="back-to-login">
      <a href="login.html">Back to Login</a>
    </div>
  </div>

  <script>
    function resetPassword() {
      const email = document.getElementById('email').value.trim();
      const successMsg = document.getElementById('successMsg');

      // Simulate a successful password reset (you'd call an API in real life)
      if (email) {
        successMsg.textContent = "Password reset link sent to your email!";
      } else {
        successMsg.textContent = "Please enter a valid email.";
        successMsg.style.color = "red";
      }
    }
  </script>
</body>
</html>
